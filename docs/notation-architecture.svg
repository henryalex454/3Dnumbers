<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" role="img" aria-label="3D Numbers: Kayıpsız L0-L3 kademeli gösterim ve 3SDLFSLK21 6-DOF token anatomisi">
  <rect width="1120" height="500" rx="14" fill="#090D16" stroke="#1E293B" stroke-width="1.5" />

  <text x="40" y="42" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12">
    ŞEKİL 2 · KAYIPSIZ KADEMELİ GÖSTERİM (L0 → L3) VE 3SDLFSLK21 6-DOF VEKTÖR KODLAYICISI
  </text>
  <text x="40" y="70" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700">
    Tek Matematiksel Nesne, Dört Kayıpsız Temsil Katmanı
  </text>

  <!-- Progressive Disclosure Pipeline L0 -> L3 -->
  <g transform="translate(40, 96)">
    <!-- L0 -->
    <rect x="0" y="0" width="210" height="128" rx="8" fill="#0F172A" stroke="#1E293B" />
    <text x="16" y="26" fill="#60A5FA" font-family="ui-monospace, monospace" font-size="11" font-weight="700">L0 · SKALER GÖVDE</text>
    <text x="16" y="64" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="28" font-weight="700">3</text>
    <text x="16" y="92" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">Sayı doğrusu üzerindeki</text>
    <text x="16" y="108" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">baskın ana değer</text>

    <!-- Arrow -->
    <text x="223" y="68" fill="#475569" font-family="ui-monospace, monospace" font-size="18">⇄</text>

    <!-- L1 -->
    <rect x="252" y="0" width="245" height="128" rx="8" fill="#0F172A" stroke="#1E293B" />
    <text x="268" y="26" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">L1 · KARAR ŞERİDİ</text>
    <text x="268" y="58" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="12.5">Z[ ✓ ◐ ✓ ] | A[ ▆ ▂ ▄ ]</text>
    <text x="268" y="78" fill="#34D399" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700">→ KABUL (45%)</text>
    <text x="268" y="106" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">Tek bakışta marj &amp; kapı özeti</text>

    <!-- Arrow -->
    <text x="510" y="68" fill="#475569" font-family="ui-monospace, monospace" font-size="18">⇄</text>

    <!-- L2 -->
    <rect x="538" y="0" width="265" height="128" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-opacity="0.6" />
    <text x="554" y="26" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">L2 · AÇIK / CEBİRSEL / TOKEN</text>
    <text x="554" y="52" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="11">0 &lt;= 19.2 &lt;= 20 mm ◐</text>
    <text x="554" y="72" fill="#93C5FD" font-family="ui-monospace, monospace" font-size="11">&amp;(sig=161.6^200+, !gun=10^14+)+</text>
    <text x="554" y="94" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Token: 3SDLFSLK21</text>
    <text x="554" y="112" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">İnsan &amp; YZ sıfır-eğitim uyumlu</text>

    <!-- Arrow -->
    <text x="816" y="68" fill="#475569" font-family="ui-monospace, monospace" font-size="18">⇄</text>

    <!-- L3 -->
    <rect x="844" y="0" width="196" height="128" rx="8" fill="#0F172A" stroke="#10B981" stroke-opacity="0.65" />
    <text x="860" y="26" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">L3 · 3B YEREL AĞAÇ</text>
    <text x="860" y="56" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">90° Yerel Eksenler</text>
    <text x="860" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">• İlişki seviyeli dallar</text>
    <text x="860" y="94" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">• Gradyan vektörleri (∇)</text>
    <text x="860" y="112" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">• Belirsizlik zarfları (±Δ)</text>
  </g>

  <!-- 3SDLFSLK21 Token Anatomy Strip -->
  <g transform="translate(40, 260)">
    <rect x="0" y="0" width="1040" height="206" rx="10" fill="#0F172A" stroke="#1E293B" />
    <text x="24" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="700">
      Kompakt Vektör İmzası Anatomisi: 3SDLFSLK21
    </text>
    <text x="24" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">
      Her harf A–Z aralığından [−1.0, +1.0] yerel eksen vektör bileşenine eşlenir; sayı doğrusu üzerindeki 3 gövdesini 6 serbestlik derecesiyle (6-DOF) niteler.
    </text>

    <!-- Character Boxes -->
    <g transform="translate(24, 72)" font-family="ui-monospace, monospace" text-anchor="middle">
      <!-- 3 -->
      <rect x="0" y="0" width="94" height="58" rx="6" fill="#1D4ED8" fill-opacity="0.28" stroke="#3B82F6" stroke-width="2" />
      <text x="47" y="37" fill="#FFFFFF" font-size="26" font-weight="700">3</text>
      <text x="47" y="78" fill="#60A5FA" font-size="11" font-weight="700">Ana Gövde</text>
      <text x="47" y="94" fill="#94A3B8" font-size="10">X = 3.0</text>

      <!-- S -->
      <rect x="108" y="0" width="90" height="58" rx="6" fill="#D97706" fill-opacity="0.22" stroke="#F59E0B" stroke-width="1.5" />
      <text x="153" y="37" fill="#FCD34D" font-size="24" font-weight="700">S</text>
      <text x="153" y="78" fill="#FBBF24" font-size="11" font-weight="700">Kabul Kuralı</text>
      <text x="153" y="94" fill="#94A3B8" font-size="10">Skor (%t)</text>

      <!-- D L F S L K (6-DOF) -->
      <g transform="translate(212, 0)">
        <rect x="0" y="0" width="102" height="58" rx="6" fill="#0284C7" fill-opacity="0.18" stroke="#38BDF8" />
        <text x="51" y="37" fill="#E0F2FE" font-size="24" font-weight="700">D</text>
        <text x="51" y="78" fill="#7DD3FC" font-size="11" font-weight="700">X · Marj</text>
        <text x="51" y="94" fill="#94A3B8" font-size="10">−0.76</text>

        <rect x="112" y="0" width="102" height="58" rx="6" fill="#0284C7" fill-opacity="0.18" stroke="#38BDF8" />
        <text x="163" y="37" fill="#E0F2FE" font-size="24" font-weight="700">L</text>
        <text x="163" y="78" fill="#7DD3FC" font-size="11" font-weight="700">Y · Gradyan ∇</text>
        <text x="163" y="94" fill="#94A3B8" font-size="10">−0.12</text>

        <rect x="224" y="0" width="102" height="58" rx="6" fill="#0284C7" fill-opacity="0.18" stroke="#38BDF8" />
        <text x="275" y="37" fill="#E0F2FE" font-size="24" font-weight="700">F</text>
        <text x="275" y="78" fill="#7DD3FC" font-size="11" font-weight="700">Z · Kuplaj ρ</text>
        <text x="275" y="94" fill="#94A3B8" font-size="10">−0.60</text>

        <rect x="336" y="0" width="102" height="58" rx="6" fill="#0284C7" fill-opacity="0.18" stroke="#38BDF8" />
        <text x="387" y="37" fill="#E0F2FE" font-size="24" font-weight="700">S</text>
        <text x="387" y="78" fill="#7DD3FC" font-size="11" font-weight="700">Rx · Belirsizlik</text>
        <text x="387" y="94" fill="#94A3B8" font-size="10">+0.44</text>

        <rect x="448" y="0" width="102" height="58" rx="6" fill="#0284C7" fill-opacity="0.18" stroke="#38BDF8" />
        <text x="499" y="37" fill="#E0F2FE" font-size="24" font-weight="700">L</text>
        <text x="499" y="78" fill="#7DD3FC" font-size="11" font-weight="700">Ry · Ağırlık w</text>
        <text x="499" y="94" fill="#94A3B8" font-size="10">−0.12</text>

        <rect x="560" y="0" width="102" height="58" rx="6" fill="#0284C7" fill-opacity="0.18" stroke="#38BDF8" />
        <text x="611" y="37" fill="#E0F2FE" font-size="24" font-weight="700">K</text>
        <text x="611" y="78" fill="#7DD3FC" font-size="11" font-weight="700">Rz · Hedef τ</text>
        <text x="611" y="94" fill="#94A3B8" font-size="10">−0.20</text>
      </g>

      <!-- 21 -->
      <rect x="886" y="0" width="106" height="58" rx="6" fill="#059669" fill-opacity="0.22" stroke="#10B981" stroke-width="1.5" />
      <text x="939" y="37" fill="#6EE7B7" font-size="24" font-weight="700">21</text>
      <text x="939" y="78" fill="#34D399" font-size="11" font-weight="700">Topoloji</text>
      <text x="939" y="94" fill="#94A3B8" font-size="10">Derinlik 2 · Grup 1</text>
    </g>
  </g>
</svg>
