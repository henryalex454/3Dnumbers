<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img" aria-label="3D Numbers: Sayı doğrusu üzerinde baskın gövdeli yerel 3B eksenli ağaç diyagramı">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0D1424" />
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="45%" stop-color="#475569" />
      <stop offset="55%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.06" />
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60A5FA" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FB923C" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1120" height="640" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle perspective grid -->
  <g stroke="#162033" stroke-width="1">
    <line x1="80" y1="490" x2="1040" y2="490" />
    <line x1="120" y1="530" x2="1000" y2="530" />
    <line x1="160" y1="570" x2="960" y2="570" />
    <line x1="200" y1="450" x2="920" y2="450" />
    <line x1="360" y1="450" x2="210" y2="590" />
    <line x1="560" y1="450" x2="560" y2="590" />
    <line x1="760" y1="450" x2="910" y2="590" />
  </g>

  <!-- Header Caption -->
  <text x="40" y="44" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">
    ŞEKİL 1 · SAYI DOĞRUSU ÜZERİNDE BASKIN GÖVDELİ YEREL 3B EKSENLİ AĞAÇ MODELİ
  </text>
  <text x="40" y="72" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">
    Ana Sayı (Gövde) + 90° Yerel Eksenler + İlişki Seviyesi Dalları
  </text>

  <!-- 1D Real Number Line (X-Axis) -->
  <g>
    <line x1="90" y1="515" x2="1030" y2="515" stroke="#475569" stroke-width="4" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)" />
    <text x="1045" y="520" fill="#60A5FA" font-family="ui-monospace, monospace" font-size="13" font-weight="700">+X</text>
    <text x="58" y="520" fill="#64748B" font-family="ui-monospace, monospace" font-size="13">−X</text>
    <!-- Ticks -->
    <g stroke="#64748B" stroke-width="2" font-family="ui-monospace, monospace" font-size="12" fill="#94A3B8" text-anchor="middle">
      <line x1="200" y1="507" x2="200" y2="523" /><text x="200" y="544">0</text>
      <line x1="320" y1="507" x2="320" y2="523" /><text x="320" y="544">1</text>
      <line x1="440" y1="507" x2="440" y2="523" /><text x="440" y="544">2</text>
      <line x1="560" y1="503" x2="560" y2="527" stroke="#60A5FA" stroke-width="3" />
      <text x="560" y="548" fill="#60A5FA" font-weight="700" font-size="15">3 (Ana Gövde)</text>
      <line x1="680" y1="507" x2="680" y2="523" /><text x="680" y="544">4</text>
      <line x1="800" y1="507" x2="800" y2="523" /><text x="800" y="544">5</text>
      <line x1="920" y1="507" x2="920" y2="523" /><text x="920" y="544">6</text>
    </g>
  </g>

  <!-- Orthogonal Local Z-Axis (90 deg into depth) -->
  <line x1="455" y1="575" x2="665" y2="455" stroke="#38BDF8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowCyan)" />
  <text x="674" y="452" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="12" font-weight="600">
    +Z (Bağımlılık / İlişki Düzlemi)
  </text>

  <!-- m = 0 Acceptance Boundary Disc Plane -->
  <ellipse cx="560" cy="340" rx="285" ry="62" fill="url(#planeGrad)" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="858" y="344" fill="#60A5FA" font-family="ui-monospace, monospace" font-size="12">
    m = 0 Sınır Düzlemi
  </text>
  <text x="858" y="362" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">
    Üstü: Kabul (m ≥ 0) · Altı: Ret (m &lt; 0)
  </text>

  <!-- DOMINANT TRUNK (Baskın Gövde) seated flush at x = 3 -->
  <g>
    <!-- Base Machined Flange -->
    <ellipse cx="560" cy="515" rx="44" ry="13" fill="#1E293B" stroke="#10B981" stroke-width="2.5" />
    <!-- Thick Dominant Column -->
    <rect x="538" y="170" width="44" height="345" rx="6" fill="url(#trunkGrad)" stroke="#60A5FA" stroke-width="1.5" />
    <!-- Structural Hub Collars -->
    <ellipse cx="560" cy="395" rx="27" ry="8" fill="#334155" stroke="#94A3B8" stroke-width="1.2" />
    <ellipse cx="560" cy="325" rx="27" ry="8" fill="#334155" stroke="#94A3B8" stroke-width="1.2" />
    <ellipse cx="560" cy="255" rx="27" ry="8" fill="#334155" stroke="#94A3B8" stroke-width="1.2" />
    <!-- +Y Local Axis Extension -->
    <line x1="560" y1="168" x2="560" y2="112" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrowGreen)" />
    <text x="576" y="122" fill="#34D399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">
      +Y (Normalize Marj 0 → 1)
    </text>
    <!-- Crown Verdict Beacon -->
    <polygon points="560,136 578,156 560,176 542,156" fill="#10B981" stroke="#A7F3D0" stroke-width="1.5" />

    <!-- Dominant Anchor Plate -->
    <rect x="448" y="76" width="224" height="44" rx="8" fill="#0B1120" stroke="#34D399" stroke-width="2" />
    <text x="560" y="96" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="16" font-weight="700">
      3SDLFSLK21
    </text>
    <text x="560" y="112" text-anchor="middle" fill="#34D399" font-family="ui-monospace, monospace" font-size="11">
      ANA GÖVDE: 3 · ✓ KABUL
    </text>
  </g>

  <!-- LEVEL 1 BRANCHES (Coupled Group ',' on Left-Front Sector) -->
  <!-- Branch L1-1: Mandatory (!), high margin -->
  <path d="M 538 325 C 455 325, 420 230, 345 215" fill="none" stroke="#10B981" stroke-width="7" stroke-linecap="round" />
  <!-- Mandatory Double Collar (‖) -->
  <line x1="468" y1="296" x2="476" y2="314" stroke="#E2E8F0" stroke-width="3" />
  <line x1="460" y1="292" x2="468" y2="310" stroke="#E2E8F0" stroke-width="3" />
  <circle cx="345" cy="215" r="12" fill="#10B981" stroke="#ECFDF5" stroke-width="2" />
  <!-- Gradient arrow ∇ -->
  <line x1="345" y1="215" x2="312" y2="176" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrowCyan)" />
  <text x="206" y="198" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="12" font-weight="600">!L1 · Zorunlu Dal</text>
  <text x="206" y="214" fill="#34D399" font-family="ui-monospace, monospace" font-size="11">marj +62% · ∇=+0.74</text>

  <!-- Branch L1-2: Marginal warning (◐), sits near m=0 plane -->
  <path d="M 538 325 C 460 330, 415 335, 340 326" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
  <circle cx="340" cy="326" r="11" fill="#F59E0B" stroke="#FEF3C7" stroke-width="2" />
  <line x1="340" y1="326" x2="315" y2="365" stroke="#FB923C" stroke-width="2.2" marker-end="url(#arrowOrange)" />
  <text x="172" y="324" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="12" font-weight="600">L1 · Sınırda Dal (◐)</text>
  <text x="172" y="340" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11">marj +4% (m ≈ 0)</text>

  <!-- Coupled Dependency Bridge (',') connecting L1-1 and L1-2 -->
  <path d="M 345 215 Q 290 270 340 326" fill="none" stroke="#60A5FA" stroke-width="2.2" stroke-dasharray="5 4" />
  <text x="220" y="274" fill="#60A5FA" font-family="ui-monospace, monospace" font-size="11">Bağlı Grup (,)</text>

  <!-- LEVEL 2 SUB-BRANCH sprouting from L1-1 -->
  <path d="M 345 215 C 310 185, 255 150, 210 142" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="210" cy="142" r="8" fill="#38BDF8" stroke="#E0F2FE" stroke-width="1.8" />
  <text x="72" y="138" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="11" font-weight="600">L2 · Alt İlişki Dalı</text>
  <text x="72" y="153" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="10">Türetilmiş / 6-DOF Rx</text>

  <!-- LEVEL 1 INDEPENDENT BRANCH (';') on Right Sector -->
  <!-- Passing Independent Branch -->
  <path d="M 582 255 C 660 255, 710 210, 790 200" fill="none" stroke="#10B981" stroke-width="5.5" stroke-linecap="round" />
  <circle cx="790" cy="200" r="11" fill="#10B981" stroke="#ECFDF5" stroke-width="2" />
  <!-- Uncertainty Envelope Cylinder -->
  <rect x="774" y="176" width="32" height="48" rx="8" fill="#38BDF8" fill-opacity="0.18" stroke="#38BDF8" stroke-width="1.2" />
  <text x="820" y="196" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="12" font-weight="600">L1 · Bağımsız Dal (;)</text>
  <text x="820" y="212" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="11">Belirsizlik Zarfı (±Δ)</text>

  <!-- LEVEL 2 SUB-BRANCH in Rejection Zone (m < 0) -->
  <path d="M 582 395 C 655 400, 705 425, 775 438" fill="none" stroke="#F43F5E" stroke-width="4" stroke-linecap="round" />
  <circle cx="775" cy="438" r="9.5" fill="#F43F5E" stroke="#FFE4E6" stroke-width="2" />
  <!-- Dashed drop to m=0 plane -->
  <line x1="775" y1="358" x2="775" y2="428" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="798" y="434" fill="#FDA4AF" font-family="ui-monospace, monospace" font-size="12" font-weight="600">?L2 · Ret Bölgesi (✕)</text>
  <text x="798" y="450" fill="#FB7185" font-family="ui-monospace, monospace" font-size="11">m &lt; 0 · Düşük öncelik uyarısı</text>

  <!-- Legend Strip at Bottom -->
  <g transform="translate(40, 588)" font-family="ui-monospace, monospace" font-size="11.5" fill="#CBD5E1">
    <rect x="0" y="0" width="1040" height="36" rx="6" fill="#0B1120" stroke="#1E293B" />
    <text x="18" y="22">■ Kalın Gövde = Ana Skaler Sayı</text>
    <text x="260" y="22" fill="#E2E8F0">‖ Çift Halka = Zorunlu (!)</text>
    <text x="470" y="22" fill="#60A5FA">⋯ Mavi Yay = Bağlı Parametreler (,)</text>
    <text x="752" y="22" fill="#38BDF8">↗ Ok = Duyarlılık Gradyanı (∇)</text>
  </g>
</svg>
